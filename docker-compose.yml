# Local/self-hosted stack:  cp .env.example .env  &&  docker compose up --build
# Web UI: http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auditor
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment: &backend-env
      AUDITOR_DATABASE_URL: postgresql+psycopg://auditor:${POSTGRES_PASSWORD}@db/auditor
      AUDITOR_REDIS_URL: redis://redis:6379/0
      AUDITOR_WORKSPACE_ROOT: /data/workspaces
      AUDITOR_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes: [workspaces:/data/workspaces]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      <<: *backend-env
      # Running repository test suites needs a Docker daemon. It is OFF by default because
      # giving a container the host Docker socket is equivalent to root on the host.
      # To enable, prefer a dedicated sandbox host (DOCKER_HOST=tcp://sandbox:2376 with TLS)
      # and a hardened runtime (AUDITOR_SANDBOX_RUNTIME=runsc), then set this to "true".
      AUDITOR_SANDBOX_ENABLED: ${AUDITOR_SANDBOX_ENABLED:-false}
    volumes:
      - workspaces:/data/workspaces
      - trivycache:/home/auditor/.cache
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      # Healthy when this container's RQ worker is registered in Redis.
      test: ["CMD", "python", "-c", "import os,socket,sys; from redis import Redis; from rq import Worker; r = Redis.from_url(os.environ['AUDITOR_REDIS_URL']); sys.exit(0 if any(w.hostname == socket.gethostname() for w in Worker.all(connection=r)) else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "2", memory: 4g}

  # Enforces AUDITOR_WORKSPACE_TTL_HOURS even when no audits run (SEC-08): purges expired
  # source copies and orphaned workspaces once an hour.
  cleanup:
    build: ./backend
    command: ["sh", "-c", "while true; do python -m app.worker cleanup; sleep 3600; done"]
    env_file: .env
    environment: *backend-env
    volumes: [workspaces:/data/workspaces]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web:
    build:
      context: ./frontend
      args: {AUDITOR_API_URL: "http://api:8000"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  pgdata:
  workspaces:
  trivycache:
