# Production overlay: HTTPS ingress, no plain-HTTP app port.
#   cp .env.production.example .env   # fill in every CHANGE-ME, including AUDITOR_DOMAIN
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
# Point the domain's DNS at this host and open ports 80 and 443.
services:
  web:
    ports: !reset []   # reachable only through Caddy

  api:
    environment:
      # Safe only because Caddy is the sole entry point and overwrites the header (deploy/Caddyfile).
      AUDITOR_TRUST_CLIENT_IP_HEADER: "true"
      AUDITOR_CORS_ORIGINS: '["https://${AUDITOR_DOMAIN:?set AUDITOR_DOMAIN in .env}"]'

  caddy:
    build:
      context: ./deploy
      dockerfile: Dockerfile.caddy
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      AUDITOR_DOMAIN: ${AUDITOR_DOMAIN:?set AUDITOR_DOMAIN in .env}
    volumes:
      - caddy_data:/data        # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

volumes:
  caddy_data:
  caddy_config:
